<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Bill — SmartBill</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="has-sidebar">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="navbar-brand">
                <span class="brand-icon"><i class="fas fa-bolt"></i></span>
                <span class="brand-text">Smart<span class="text-gradient">Bill</span></span>
            </a>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="sidebar-link">
                <i class="fas fa-grid-2"></i>
                <span>Dashboard</span>
            </a>
            <a href="products.html" class="sidebar-link">
                <i class="fas fa-boxes-stacked"></i>
                <span>Products</span>
            </a>
            <a href="billing.html" class="sidebar-link active">
                <i class="fas fa-file-invoice-dollar"></i>
                <span>Billing</span>
            </a>
            <a href="sales.html" class="sidebar-link">
                <i class="fas fa-chart-line"></i>
                <span>Sales History</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <a href="index.html" class="sidebar-link">
                <i class="fas fa-arrow-left"></i>
                <span>Back to Home</span>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="topbar">
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                <i class="fas fa-bars"></i>
            </button>
            <h1 class="topbar-title">Create New Bill</h1>
            <div class="topbar-actions">
                <span class="topbar-date" id="currentDate"></span>
            </div>
        </header>

        <div class="page-content">
            <div class="billing-layout">
                <!-- Left Column: Product Picker + Cart -->
                <div class="billing-left">
                    <!-- Product Search & Pick -->
                    <div class="content-card glass animate-fadeInUp">
                        <div class="content-card-header">
                            <h2 class="content-card-title">
                                <i class="fas fa-search" style="color: var(--color-info)"></i>
                                Select Products
                            </h2>
                        </div>
                        <div class="search-filter-bar" style="border-top: none;">
                            <div class="search-input-wrap">
                                <i class="fas fa-search"></i>
                                <input type="text" id="productSearch" placeholder="Search products by name or category...">
                            </div>
                        </div>
                        <div class="product-pick-list" id="productPickList">
                            <!-- Populated by JS -->
                        </div>
                    </div>

                    <!-- Cart -->
                    <div class="content-card glass animate-fadeInUp" style="animation-delay: 0.1s">
                        <div class="content-card-header">
                            <h2 class="content-card-title">
                                <i class="fas fa-cart-shopping" style="color: var(--color-accent)"></i>
                                Cart
                            </h2>
                            <span class="cart-count" id="cartCount">0 items</span>
                        </div>
                        <div id="cartList">
                            <div class="cart-empty">
                                <i class="fas fa-cart-shopping"></i>
                                <p>Cart is empty. Pick a product above.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Bill Details -->
                <div class="billing-right">
                    <div class="content-card glass animate-fadeInUp" style="animation-delay: 0.2s">
                        <div class="content-card-header">
                            <h2 class="content-card-title">
                                <i class="fas fa-file-invoice" style="color: var(--color-success)"></i>
                                Bill Details
                            </h2>
                        </div>
                        <div class="bill-form">
                            <div class="form-group">
                                <label for="custName">Customer Name</label>
                                <input type="text" id="custName" class="form-input" placeholder="Walk-in Customer">
                            </div>
                            <div class="form-group">
                                <label for="custPhone">Phone (optional)</label>
                                <input type="text" id="custPhone" class="form-input" placeholder="98765 43210">
                            </div>
                            <div class="form-group">
                                <label for="payMethod">Payment Method</label>
                                <select id="payMethod" class="form-input">
                                    <option value="Cash">💵 Cash</option>
                                    <option value="UPI">📱 UPI</option>
                                    <option value="Card">💳 Card</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="discount">Discount (₹)</label>
                                <input type="number" id="discount" class="form-input" min="0" step="0.01" value="0">
                            </div>
                        </div>

                        <!-- Totals -->
                        <div class="bill-totals">
                            <div class="totals-row">
                                <span>Subtotal</span>
                                <span id="totalSubtotal">₹ 0.00</span>
                            </div>
                            <div class="totals-row">
                                <span>Discount</span>
                                <span id="totalDiscount" class="text-success">- ₹ 0.00</span>
                            </div>
                            <div class="totals-row totals-grand">
                                <span>Total</span>
                                <span id="totalGrand">₹ 0.00</span>
                            </div>
                        </div>

                        <div class="bill-action">
                            <button class="btn btn-primary btn-lg" id="checkoutBtn" style="width: 100%; justify-content: center;">
                                <i class="fas fa-receipt"></i>
                                <span>Generate Bill & Invoice</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="notifications" id="notifications"></div>

    <script src="js/main.js"></script>
    <script src="js/cerebrium-motion.js"></script>
    <script src="js/billing.js"></script>
</body>
</html>
