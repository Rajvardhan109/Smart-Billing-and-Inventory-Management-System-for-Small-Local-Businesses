<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products — SmartBill</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="has-sidebar">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="navbar-brand">
                <span class="brand-icon"><i class="fas fa-bolt"></i></span>
                <span class="brand-text">Smart<span class="text-gradient">Bill</span></span>
            </a>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="sidebar-link">
                <i class="fas fa-grid-2"></i>
                <span>Dashboard</span>
            </a>
            <a href="products.html" class="sidebar-link active">
                <i class="fas fa-boxes-stacked"></i>
                <span>Products</span>
            </a>
            <a href="billing.html" class="sidebar-link">
                <i class="fas fa-file-invoice-dollar"></i>
                <span>Billing</span>
            </a>
            <a href="sales.html" class="sidebar-link">
                <i class="fas fa-chart-line"></i>
                <span>Sales History</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <a href="index.html" class="sidebar-link">
                <i class="fas fa-arrow-left"></i>
                <span>Back to Home</span>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="topbar">
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                <i class="fas fa-bars"></i>
            </button>
            <h1 class="topbar-title">Products & Inventory</h1>
            <div class="topbar-actions">
                <button class="btn btn-primary btn-sm" id="openAddBtn">
                    <i class="fas fa-plus"></i>
                    <span>Add Product</span>
                </button>
            </div>
        </header>

        <div class="page-content">
            <!-- Search & Filter -->
            <div class="content-card glass animate-fadeInUp">
                <div class="search-filter-bar">
                    <div class="search-input-wrap">
                        <i class="fas fa-search"></i>
                        <input type="text" id="productSearch" placeholder="Search products by name or category...">
                    </div>
                    <select id="stockFilter" class="filter-select">
                        <option value="all">All Products</option>
                        <option value="in-stock">In Stock</option>
                        <option value="low-stock">Low Stock</option>
                        <option value="out-of-stock">Out of Stock</option>
                    </select>
                </div>
            </div>

            <!-- Products Table -->
            <div class="content-card glass animate-fadeInUp" style="animation-delay: 0.1s">
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Category</th>
                                <th>Price (₹)</th>
                                <th>In Stock</th>
                                <th>Threshold</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="productsBody">
                            <tr>
                                <td colspan="7" class="table-empty">Loading products...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Add/Edit Product Modal -->
    <div class="modal-overlay" id="modalBackdrop">
        <div class="modal glass">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Add Product</h2>
                <button class="modal-close" id="modalClose" aria-label="Close">
                    <i class="fas fa-xmark"></i>
                </button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="productId">
                <div class="form-group">
                    <label for="fName">Product Name</label>
                    <input type="text" id="fName" class="form-input" placeholder="e.g. Basmati Rice 5kg">
                </div>
                <div class="form-group">
                    <label for="fCategory">Category</label>
                    <input type="text" id="fCategory" class="form-input" placeholder="e.g. Groceries">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="fCostPrice">Cost Price (₹)</label>
                        <input type="number" id="fCostPrice" class="form-input" min="0" step="0.01" placeholder="0.00" title="Your purchase cost (used to calculate profit)">
                    </div>
                    <div class="form-group">
                        <label for="fPrice">Selling Price (₹)</label>
                        <input type="number" id="fPrice" class="form-input" min="0" step="0.01" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label for="fQuantity">Quantity</label>
                        <input type="number" id="fQuantity" class="form-input" min="0" step="1" placeholder="0">
                    </div>
                </div>
                <div class="form-group">
                    <label for="fThreshold">Low Stock Alert Threshold</label>
                    <input type="number" id="fThreshold" class="form-input" min="0" step="1" value="5">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modalCancel">Cancel</button>
                <button class="btn btn-primary" id="modalSave">
                    <i class="fas fa-check"></i>
                    <span>Save Product</span>
                </button>
            </div>
        </div>
    </div>

    <div class="notifications" id="notifications"></div>

    <script src="js/main.js"></script>
    <script src="js/cerebrium-motion.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
