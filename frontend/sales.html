<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales History — SmartBill</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="has-sidebar">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="navbar-brand">
                <span class="brand-icon"><i class="fas fa-bolt"></i></span>
                <span class="brand-text">Smart<span class="text-gradient">Bill</span></span>
            </a>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="sidebar-link">
                <i class="fas fa-grid-2"></i>
                <span>Dashboard</span>
            </a>
            <a href="products.html" class="sidebar-link">
                <i class="fas fa-boxes-stacked"></i>
                <span>Products</span>
            </a>
            <a href="billing.html" class="sidebar-link">
                <i class="fas fa-file-invoice-dollar"></i>
                <span>Billing</span>
            </a>
            <a href="sales.html" class="sidebar-link active">
                <i class="fas fa-chart-line"></i>
                <span>Sales History</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <a href="index.html" class="sidebar-link">
                <i class="fas fa-arrow-left"></i>
                <span>Back to Home</span>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="topbar">
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                <i class="fas fa-bars"></i>
            </button>
            <h1 class="topbar-title">Sales History</h1>
            <div class="topbar-actions">
                <a href="billing.html" class="btn btn-primary btn-sm">
                    <i class="fas fa-plus"></i>
                    <span>New Bill</span>
                </a>
            </div>
        </header>

        <div class="page-content">
            <!-- Sales Summary -->
            <div class="dashboard-cards" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
                <div class="dash-card animate-fadeInUp">
                    <div class="dash-card-icon" style="--accent: #3b82f6">
                        <i class="fas fa-receipt"></i>
                    </div>
                    <div class="dash-card-info">
                        <span class="dash-card-value" id="totalSalesCount">0</span>
                        <span class="dash-card-label">Total Bills</span>
                    </div>
                </div>
                <div class="dash-card animate-fadeInUp" style="animation-delay: 0.1s">
                    <div class="dash-card-icon" style="--accent: #10b981">
                        <i class="fas fa-indian-rupee-sign"></i>
                    </div>
                    <div class="dash-card-info">
                        <span class="dash-card-value" id="totalSalesRevenue">₹0</span>
                        <span class="dash-card-label">Total Revenue</span>
                    </div>
                </div>
            </div>

            <!-- Sales Table -->
            <div class="content-card glass animate-fadeInUp" style="animation-delay: 0.2s">
                <div class="content-card-header">
                    <h2 class="content-card-title">
                        <i class="fas fa-clock-rotate-left" style="color: var(--color-info)"></i>
                        All Transactions
                    </h2>
                </div>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Invoice #</th>
                                <th>Date & Time</th>
                                <th>Customer</th>
                                <th>Payment</th>
                                <th>Amount (₹)</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="salesBody">
                            <tr>
                                <td colspan="6" class="table-empty">Loading sales data...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div class="notifications" id="notifications"></div>

    <script src="js/main.js"></script>
    <script src="js/cerebrium-motion.js"></script>
    <script src="js/sales.js"></script>
</body>
</html>
