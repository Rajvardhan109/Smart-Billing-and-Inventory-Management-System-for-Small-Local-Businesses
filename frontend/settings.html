<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - SmartBill</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="has-sidebar">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="navbar-brand">
                <span class="brand-icon"><i class="fas fa-bolt"></i></span>
                <span class="brand-text">Smart<span class="text-gradient">Bill</span></span>
            </a>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="sidebar-link active">
                <i class="fas fa-grid-2"></i>
                <span>Dashboard</span>
            </a>
            <a href="products.html" class="sidebar-link">
                <i class="fas fa-boxes-stacked"></i>
                <span>Products</span>
            </a>
            <a href="billing.html" class="sidebar-link">
                <i class="fas fa-file-invoice-dollar"></i>
                <span>Billing</span>
            </a>
            <a href="sales.html" class="sidebar-link">
                <i class="fas fa-chart-line"></i>
                <span>Sales History</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <a href="index.html" class="sidebar-link">
                <i class="fas fa-arrow-left"></i>
                <span>Back to Home</span>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Bar -->
        <header class="topbar">
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                <i class="fas fa-bars"></i>
            </button>
            <h1 class="topbar-title">Settings</h1>
            <div class="topbar-actions" style="display: flex; gap: 1rem; align-items: center;">
                <span class="topbar-date" id="welcomeMessage" style="font-weight: 500; color: #fff;"></span>
                <span class="topbar-date" id="currentDate"></span>
                <a href="settings.html" class="btn btn-primary" style="padding: 0.5rem 1rem; font-size: 0.85rem; border-radius: 6px;">
                    <i class="fas fa-user-cog"></i> Settings
                </a>
            </div>
        </header>

        <div class="page-content"><div class="glass" style="padding: 2rem; max-width: 600px; margin: 0 auto; border-radius: 12px;"><h2 style="margin-bottom: 1.5rem;">Account Settings</h2><form id="settingsForm"><div class="form-group"><label>Email Address (Read Only)</label><input type="email" id="set_email" class="form-input" disabled></div><div class="form-group"><label>First Name</label><input type="text" id="set_fname" class="form-input" required></div><div class="form-group"><label>Last Name</label><input type="text" id="set_lname" class="form-input"></div><div class="form-group"><label>Store Name</label><input type="text" id="set_store" class="form-input" required></div><button type="submit" id="saveSettingsBtn" class="btn btn-primary" style="width: 100%; margin-top: 1rem; justify-content: center;"><i class="fas fa-save"></i> Save Changes</button><button type="button" onclick="window.logout()" class="btn btn-danger" style="width: 100%; margin-top: 1rem; justify-content: center; background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3);"><i class="fas fa-sign-out-alt"></i> Sign Out</button></form></div></div><div class="notifications" id="notifications"></div>

    <script src="js/main.js"></script>
    <script src="js/cerebrium-motion.js"></script>
</body>
</html>
